<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="rocket.png" type="image/png">
    <title> Mini Pygames </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            min-height: 100%; 
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #c800ff, #00c8ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; 
        }
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffb370, #ff73ce);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 100%; 
            max-width: 1200px; /* العرض الأقصى 1200 ممتاز جداً لترتيب 5 كروت (3 فوق و 2 تحت) */
            min-height: auto; 
        }

        h1 {
            font-size: clamp(2rem, 8vw, 4rem); 
            margin-bottom: 20px;
            color: #5e35b1;
        }
        p.subtitle {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            margin-bottom: 40px;
            color: #3aa040;
        }
        .games {
            display: flex;
            justify-content: center;
            gap: 20px; 
            flex-wrap: wrap; 
        }
        
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            background-color: rgba(240, 240, 240, 0.8);
            transition: transform 0.3s, box-shadow 0.3s;
            width: 300px; 
            min-height: 450px;
        }
        
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.25);
        }

        .game-card img {
            width: 100%;
            height: 200px; 
            border-radius: 15px;
            object-fit: contain; 
            margin-bottom: 15px;
        }

        .game-card h3 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #3aa040;
        }

        .coming-soon {
            filter: grayscale(1); 
            opacity: 0.8;
        }

        .game-card p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
            flex-grow: 1; 
        }

        .purchase-btn {
            font-size: 1.2rem;
            padding: 12px 25px;
            background-color: #5e35b1;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            width: 80%;
        }

        .purchase-btn:hover {
            background-color: #7e57c2;
            transform: scale(1.05);
        }

        .btn-grey { background-color: grey; cursor: default; }

        @media (max-width: 480px) {
            .container { padding: 15px; }
            .game-card { width: 100%; } 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>!مرحبًا بك</h1>
        <p class="subtitle">:اختر اللعبة التي ترغب في تنزيلها</p>
        <div class="games">
            <div class="game-card">
                <img src="icon2.ico" alt="Reblu Run">
                <h3>Reblu Run</h3>
                <p>لعبة تنافسية مذهلة، كم ستصمد فيها؟</p>
                <button class="purchase-btn" onclick="location.href='reblu run setup.exe'">تنزيل</button>
            </div>
            <div class="game-card">
                <img src="icon1.ico" alt="Lightning Race">
                <h3>Lightning Race</h3>
                <p>!لعبة سباق مجانية مليئة بالتحدي بانتظارك</p>
                <button class="purchase-btn" onclick="location.href='lightning race setup.exe'">تنزيل</button>
            </div>
            <div class="game-card">
                <img src="logo icon.ico" alt="Game 3">
                <h3>Eco Fun</h3>
                <p>!حافظ على البيئة ونظف البحر</p>
                <button class="purchase-btn" onclick="location.href='eco fun setup.exe'">تنزيل</button>
            </div>
            <div class="game-card">
                <img src="space.png" alt="Game 4">
                <h3>Space Math</h3>
                <p>لتقوية وتمكين حفظ جداول الضرب</p>
                <button class="purchase-btn" onclick="location.href='space math setup.exe'">تنزيل</button>
            </div>
            <div class="game-card">
                <img src="sans icon.ico" alt="Game 5">
                <h3>Shooter Tale</h3>
                <p>!تحلى بسرعة البديهة للفوز في هذه اللعبة</p>
                <button class="purchase-btn" onclick="location.href='shooter tale setup.exe'">تنزيل</button>
            </div>
        </div>
    </div>
</body>
</html>
