<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="rocket.png" type="image/png">
    <title> Mini Pygames </title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            min-height: 100%; /* تغيير من height لـ min-height للسماح بالتمرير في الجوال */
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #c800ff, #00c8ff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px; /* مساحة أمان للشاشات الصغيرة */
        }
        .container {
            text-align: center;
            padding: 30px;
            border-radius: 20px;
            background: linear-gradient(135deg, #ffb370, #ff73ce);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            width: 100%; 
            max-width: 1200px; /* العرض الأقصى 1200 لكن يسمح بالتقلص */
            min-height: auto; /* يسمح للكونتينر بالتمدد حسب المحتوى */
        }

        h1 {
            font-size: clamp(2rem, 8vw, 4rem); /* حجم خط مرن يتغير حسب الشاشة */
            margin-bottom: 20px;
            color: #5e35b1;
        }
        p.subtitle {
            font-size: clamp(1.2rem, 4vw, 1.8rem);
            margin-bottom: 40px;
            color: #3aa040;
        }
        .games {
            display: flex;
            justify-content: center;
            gap: 20px; /* مسافة ثابتة بين الكروت */
            flex-wrap: wrap; /* هذا هو السر: ينزل الكروت تحت بعض فسي الجوال */
        }
        
        /* توحيد الـ Class للكروت لسهولة التعديل */
        .game-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            background-color: rgba(240, 240, 240, 0.8);
            transition: transform 0.3s, box-shadow 0.3s;
            width: 300px; /* عرض ثابت للكرت */
            min-height: 450px;
        }
        
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.25);
        }

        .game-card img {
            width: 100%;
            height: 200px; /* ارتفاع ثابت للصور لتوحيد الشكل */
            border-radius: 15px;
            object-fit: contain; /* يحافظ على أبعاد الصورة الأصلية */
            margin-bottom: 15px;
        }

        .game-card h3 {
            font-size: 1.6rem;
            margin-bottom: 10px;
            color: #3aa040;
        }

        /* تنسيق خاص للعبة القادمة (رمادي) */
        .coming-soon {
            filter: grayscale(1); 
            opacity: 0.8;
        }

        .game-card p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 20px;
            text-align: center;
            flex-grow: 1; /* يدفع الزر للأسفل دائماً */
        }

        .purchase-btn {
            font-size: 1.2rem;
            padding: 12px 25px;
            background-color: #5e35b1;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            width: 80%;
        }

        .purchase-btn:hover {
            background-color: #7e57c2;
            transform: scale(1.05);
        }

        .btn-grey { background-color: grey; cursor: default; }

        /* تعديلات خاصة للشاشات الصغيرة جداً */
        @media (max-width: 480px) {
            .container { padding: 15px; }
            .game-card { width: 100%; } /* الكرت يأخذ كامل العرض في التلفون */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>!مرحبًا بك</h1>
        <p class="subtitle">اختر اللعبة التي ترغب في تنزيلها</p>

        <div class="games">
            <div class="game-card">
                <img src="icon2.ico" alt="Reblu Run">
                <h3>Reblu Run</h3>
                <p>لعبة تنافسية مذهلة، كم ستصمد فيها؟</p>
                <button class="purchase-btn" onclick="location.href='pruchase.html'">شراء</button>
            </div>

            <div class="game-card">
                <img src="icon1.ico" alt="Lightning Race">
                <h3>Lightning Race</h3>
                <p>لعبة سباق مجانية مليئة بالتحدي بانتظارك</p>
                <button class="purchase-btn" onclick="location.href='lightning race setup.exe'">تنزيل</button>
            </div>

            <div class="game-card coming-soon">
                <img src="qm.png" alt="Game 3">
                <h3>Coming Soon</h3>
                <p>!تجربة مذهلة ومغامرة جديدة بانتظارك</p>
                <button class="purchase-btn btn-grey">قريباً</button>
            </div>
        </div>
    </div>
</body>
</html>
